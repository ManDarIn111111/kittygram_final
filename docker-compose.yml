name: kittygram_pz4
volumes:
  pg_data:
  static:
  media:
services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    image: kittygram_backend:local
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn kittygram_backend.wsgi:application
      --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    volumes:
      - static:/static
      - media:/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/login/')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
  frontend:
    image: kittygram_frontend:local
    build: ./frontend
    command: sh -c "cp -r /app/build/. /static/"
    volumes:
      - static:/static
  gateway:
    image: kittygram_gateway:local
    build: ./nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-9000}:80"
    volumes:
      - static:/static:ro
      - media:/media:ro
    restart: unless-stopped
